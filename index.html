<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חיפוש</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 0 24px;
      font-size: 14px;
      color: #5f6368;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 110px;
    }

    .logo {
      font-size: 82px;
      font-weight: 500;
      letter-spacing: -6px;
      margin-bottom: 28px;
      direction: ltr;
      user-select: none;
    }

    .logo span:nth-child(1) { color: #4285f4; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    .search-box {
      width: min(584px, calc(100vw - 32px));
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      transition: box-shadow 0.15s, border-color 0.15s;
      direction: rtl;
    }

    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-color: transparent;
    }

    .search-icon {
      color: #9aa0a6;
      font-size: 18px;
      margin-left: 12px;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: #202124;
      direction: rtl;
    }

    .buttons {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 10px 18px;
      cursor: pointer;
    }

    button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
    }

    .status {
      margin-top: 22px;
      font-size: 14px;
      color: #5f6368;
      min-height: 20px;
      text-align: center;
    }

    .results-page {
      display: none;
      padding: 24px 36px;
      direction: rtl;
    }

    .top-search {
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #ebebeb;
      padding-bottom: 18px;
    }

    .small-logo {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -2px;
      direction: ltr;
      white-space: nowrap;
    }

    .small-logo span:nth-child(1) { color: #4285f4; }
    .small-logo span:nth-child(2) { color: #ea4335; }
    .small-logo span:nth-child(3) { color: #fbbc05; }
    .small-logo span:nth-child(4) { color: #4285f4; }
    .small-logo span:nth-child(5) { color: #34a853; }
    .small-logo span:nth-child(6) { color: #ea4335; }

    .top-search .search-box {
      width: min(690px, calc(100vw - 150px));
      margin: 0;
    }

    .results {
      max-width: 720px;
      margin-top: 24px;
      margin-right: 110px;
    }

    .result-count {
      color: #70757a;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .result-item {
      margin-bottom: 28px;
      direction: rtl;
    }

    .result-url {
      color: #202124;
      font-size: 14px;
      direction: ltr;
      text-align: left;
    }

    .result-title {
      display: inline-block;
      color: #1a0dab;
      font-size: 20px;
      line-height: 1.3;
      text-decoration: none;
      margin-top: 4px;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-desc {
      color: #4d5156;
      font-size: 14px;
      line-height: 1.58;
      margin-top: 4px;
    }

    .no-results {
      color: #202124;
      font-size: 16px;
      line-height: 1.7;
    }

    footer {
      background: #f2f2f2;
      color: #70757a;
      font-size: 14px;
      padding: 15px 30px;
    }

    @media (max-width: 700px) {
      main {
        padding-top: 70px;
      }

      .logo {
        font-size: 58px;
      }

      .top-search {
        flex-direction: column;
        align-items: stretch;
      }

      .top-search .search-box {
        width: 100%;
      }

      .results {
        margin-right: 0;
      }

      .results-page {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <section id="homePage">
    <header>חיפוש מאובטח</header>

    <main>
      <div class="logo" aria-label="Search">
        <span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
      </div>

      <form id="homeForm" class="search-form">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input
            id="homeInput"
            type="search"
            autocomplete="off"
            placeholder="חפש באתר מורשה..."
          />
        </div>

        <div class="buttons">
          <button type="submit">חיפוש</button>
          <button type="button" id="luckyBtn">אני מרגיש בר מזל</button>
        </div>
      </form>

      <div id="status" class="status">טוען רשימת אתרים מורשים...</div>
    </main>

    <footer>תוצאות מוצגות רק מתוך רשימת האתרים הלבנה</footer>
  </section>

  <section id="resultsPage" class="results-page">
    <div class="top-search">
      <div class="small-logo">
        <span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
      </div>

      <form id="resultsForm" class="search-form">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input id="resultsInput" type="search" autocomplete="off" />
        </div>
      </form>
    </div>

    <div id="results" class="results"></div>
  </section>

  <script>
    const HOSTS_URL =
      "https://raw.githubusercontent.com/F22proApp/F22proApp/refs/heads/main/hosts.txt";

    let whiteList = [];

    const homePage = document.getElementById("homePage");
    const resultsPage = document.getElementById("resultsPage");
    const homeInput = document.getElementById("homeInput");
    const resultsInput = document.getElementById("resultsInput");
    const results = document.getElementById("results");
    const statusBox = document.getElementById("status");

    async function loadWhiteList() {
      try {
        const response = await fetch(HOSTS_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Could not load hosts file");
        }

        const text = await response.text();

        whiteList = text
          .split(/\s+/)
          .map(item => item.trim())
          .filter(Boolean)
          .filter(item => !item.startsWith("#"))
          .map(cleanHost);

        statusBox.textContent = `נטענו ${whiteList.length} אתרים מורשים`;
      } catch (error) {
        console.error(error);
        statusBox.textContent = "שגיאה בטעינת רשימת האתרים";
      }
    }

    function cleanHost(value) {
      return value
        .replace(/^https?:\/\//i, "")
        .replace(/^www\./i, "")
        .replace(/\/.*$/, "")
        .toLowerCase();
    }

    function normalizeQuery(query) {
      return query
        .trim()
        .replace(/^https?:\/\//i, "")
        .replace(/^www\./i, "")
        .replace(/\/.*$/, "")
        .toLowerCase();
    }

    function search(query) {
      const normalizedQuery = normalizeQuery(query);

      if (!normalizedQuery) return [];

      return whiteList.filter(host => {
        return (
          host.includes(normalizedQuery) ||
          normalizedQuery.includes(host)
        );
      });
    }

    function hostToUrl(host) {
      if (host === "about:blank") return "about:blank";

      if (host.startsWith("localhost")) {
        return `http://${host}`;
      }

      return `https://${host}`;
    }

    function showResults(query) {
      const matches = search(query);

      homePage.style.display = "none";
      resultsPage.style.display = "block";
      resultsInput.value = query;

      if (matches.length === 0) {
        results.innerHTML = `
          <div class="result-count">לא נמצאו תוצאות</div>
          <div class="no-results">
            לא נמצא אתר מורשה שמתאים לחיפוש:
            <strong>${escapeHtml(query)}</strong>
            <br />
            נסה לחפש דומיין, למשל:
            <strong>google</strong>,
            <strong>accounts</strong>,
            או
            <strong>tidepool</strong>.
          </div>
        `;
        return;
      }

      results.innerHTML = `
        <div class="result-count">
          נמצאו ${matches.length} תוצאות מתוך רשימת האתרים המורשים
        </div>

        ${matches.map(host => `
          <div class="result-item">
            <div class="result-url">${escapeHtml(hostToUrl(host))}</div>
            <a class="result-title" href="${escapeAttribute(hostToUrl(host))}" target="_blank" rel="noopener">
              ${escapeHtml(host)}
            </a>
            <div class="result-desc">
              אתר זה נמצא ברשימת האתרים הלבנה ולכן ניתן להציג אותו כתוצאת חיפוש.
            </div>
          </div>
        `).join("")}
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    document.getElementById("homeForm").addEventListener("submit", event => {
      event.preventDefault();
      showResults(homeInput.value);
    });

    document.getElementById("resultsForm").addEventListener("submit", event => {
      event.preventDefault();
      showResults(resultsInput.value);
    });

    document.getElementById("luckyBtn").addEventListener("click", () => {
      const matches = search(homeInput.value);

      if (matches.length > 0) {
        window.open(hostToUrl(matches[0]), "_blank", "noopener");
      } else {
        showResults(homeInput.value);
      }
    });

    loadWhiteList();
  </script>
</body>
</html>
